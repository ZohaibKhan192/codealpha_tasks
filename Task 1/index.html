<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Translation Tool</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>🌍 Language Translator</h1>
        
        <div class="language-selectors">
            <div class="language-group">
                <label for="sourceLang">From:</label>
                <select id="sourceLang">
                    <option value="auto">Auto Detect</option>
                    <option value="en">English</option>
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="it">Italian</option>
                    <option value="pt">Portuguese</option>
                    <option value="ru">Russian</option>
                    <option value="ja">Japanese</option>
                    <option value="ko">Korean</option>
                    <option value="zh">Chinese</option>
                    <option value="ar">Arabic</option>
                    <option value="hi">Hindi</option>
                    <option value="tr">Turkish</option>
                    <option value="nl">Dutch</option>
                    <option value="pl">Polish</option>
                    <option value="sv">Swedish</option>
                    <option value="da">Danish</option>
                    <option value="fi">Finnish</option>
                    <option value="no">Norwegian</option>
                </select>
            </div>

            <button class="swap-btn" id="swapBtn" title="Swap languages">⇄</button>

            <div class="language-group">
                <label for="targetLang">To:</label>
                <select id="targetLang">
                    <option value="es">Spanish</option>
                    <option value="en">English</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="it">Italian</option>
                    <option value="pt">Portuguese</option>
                    <option value="ru">Russian</option>
                    <option value="ja">Japanese</option>
                    <option value="ko">Korean</option>
                    <option value="zh">Chinese</option>
                    <option value="ar">Arabic</option>
                    <option value="hi">Hindi</option>
                    <option value="tr">Turkish</option>
                    <option value="nl">Dutch</option>
                    <option value="pl">Polish</option>
                    <option value="sv">Swedish</option>
                    <option value="da">Danish</option>
                    <option value="fi">Finnish</option>
                    <option value="no">Norwegian</option>
                </select>
            </div>
        </div>

        <div class="text-areas">
            <div class="text-area-group">
                <textarea id="sourceText" placeholder="Enter text to translate..."></textarea>
                <div class="char-count">
                    <span id="sourceCharCount">0</span> / 5000 characters
                </div>
            </div>
            <div class="text-area-group">
                <textarea id="translatedText" placeholder="Translation will appear here..." readonly></textarea>
                <div class="char-count">
                    <span id="targetCharCount">0</span> characters
                </div>
            </div>
        </div>

        <div class="button-group">
            <button id="translateBtn">
                <span>🔄</span> Translate
            </button>
            <button id="copyBtn" class="copy-btn">
                <span>📋</span> Copy
            </button>
            <button id="speakSourceBtn" class="speak-btn">
                <span>🔊</span> Speak Source
            </button>
            <button id="speakTargetBtn" class="speak-btn">
                <span>🔊</span> Speak Translation
            </button>
            <button id="clearBtn" class="clear-btn">
                <span>🗑️</span> Clear
            </button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Translating...</p>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
